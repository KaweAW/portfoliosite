<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <!-- Title, description, canonical, Open Graph and structured data are generated per page by vite-plugins/seo.ts -->
    <!--seo-->

    <style>
      /* Black background while the app loads (no white flash). */
      html,
      body {
        margin: 0;
        background: #000;
        color: #e0e0e0;
      }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* Text for crawlers and screen readers only: hidden visually so it never flashes before the app starts. */
      main.prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <noscript>
      <style>
        /* Without JavaScript the plain text is the page, so show it. */
        main.prerender {
          position: static;
          width: auto;
          height: auto;
          margin: 0;
          padding: 2rem;
          overflow: visible;
          clip: auto;
          white-space: normal;
        }
        main.prerender a {
          color: #fff;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript. Contact: kawe.longon@gmail.com</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
